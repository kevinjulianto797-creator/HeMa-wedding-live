    <!-- Dynamic In-Browser Meta Sync -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var couple = params.get('couple') || params.get('mempelai');
          var saved = localStorage.getItem('hema_wedding_settings');
          var s = saved ? JSON.parse(saved) : {};
          if (couple) {
            s.coupleTitle = couple;
            localStorage.setItem('hema_wedding_settings', JSON.stringify(s));
          }
          var title = s.coupleTitle || 'Cecep & Memey';
          document.title = 'The Wedding of ' + title + ' | Live Moments';
        } catch(e) {}
      })();
    </script>
